<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>secureRAG</title>
<style>
  :root {
    --bg: #0b0f17; --panel: #0f172a; --line: #1e293b; --text: #e2e8f0;
    --muted: #64748b; --accent: #2dd4bf; --warn: #f59e0b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text); height: 100vh;
    display: flex; flex-direction: column;
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  h1 { font: 700 16px/1 ui-monospace, Menlo, monospace; margin: 0; letter-spacing: 1px; }
  h1 span { color: var(--accent); }
  .who { color: var(--muted); font-size: 13px; margin-left: auto; }
  .who b { color: var(--text); font-weight: 600; }
  main { flex: 1; overflow-y: auto; padding: 20px; }
  .wrap { max-width: 780px; margin: 0 auto; }
  .msg { margin-bottom: 18px; }
  .role {
    font: 600 11px/1 ui-monospace, Menlo, monospace; letter-spacing: 1px;
    color: var(--muted); text-transform: uppercase; margin-bottom: 6px;
  }
  .body { white-space: pre-wrap; word-wrap: break-word; }
  .msg.user .body {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px 13px;
  }
  .msg.refused .body { color: var(--warn); }
  footer { border-top: 1px solid var(--line); padding: 14px 20px; }
  form { max-width: 780px; margin: 0 auto; display: flex; gap: 10px; }
  input, button {
    font: inherit; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); padding: 10px 13px;
  }
  input { flex: 1; min-width: 0; }
  input:focus { outline: none; border-color: var(--accent); }
  button { cursor: pointer; font-weight: 600; }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .note { color: var(--muted); font-size: 13px; }
  .error { color: var(--warn); }
  select {
    font: inherit; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); padding: 10px 13px;
  }
  .badge {
    font: 600 10px/1 ui-monospace, Menlo, monospace; letter-spacing: 1px;
    text-transform: uppercase; border: 1px solid var(--accent); color: var(--accent);
    border-radius: 4px; padding: 4px 6px; margin-left: 8px;
  }
  #upload input[type=file] { flex: 1; padding: 8px 13px; cursor: pointer; }
  #upload input[type=file]::file-selector-button {
    font: inherit; font-weight: 600; margin-right: 10px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px;
    background: var(--bg); color: var(--text);
  }
</style>
</head>
<body>
<header>
  <h1>SECURE<span>·</span>RAG</h1>
  <div class="who" id="who">not signed in</div>
</header>

<main><div class="wrap" id="log"></div></main>

<footer>
  <form id="login">
    <input id="user" placeholder="username" autocomplete="username" value="alice">
    <input id="pass" placeholder="password" type="password" autocomplete="current-password">
    <button type="submit">Sign in</button>
  </form>
  <form id="composer" style="display:none">
    <input id="message" placeholder="Ask a question…" autocomplete="off">
    <button type="submit" id="send">Send</button>
  </form>
  <form id="upload" style="display:none">
    <input id="file" type="file" accept=".txt,.md">
    <select id="tier" title="Access tier for this document"></select>
    <button type="submit" id="put">Upload</button>
  </form>
</footer>

<script>
  const log = document.getElementById('log');
  const who = document.getElementById('who');
  const loginForm = document.getElementById('login');
  const composer = document.getElementById('composer');
  const uploader = document.getElementById('upload');
  let token = null;
  let sessionId = null;

  function signedOut(reason) {
    add('system', reason, { label: 'error' });
    composer.style.display = 'none';
    uploader.style.display = 'none';
    loginForm.style.display = 'flex';
    who.textContent = 'not signed in';
    token = null; sessionId = null;
  }

  function add(role, text, opts = {}) {
    const el = document.createElement('div');
    el.className = 'msg ' + role + (opts.refused ? ' refused' : '');
    const label = document.createElement('div');
    label.className = 'role';
    label.textContent = opts.label || role;
    const body = document.createElement('div');
    body.className = 'body';
    body.textContent = text;
    el.append(label, body);
    log.append(el);
    el.scrollIntoView({ block: 'end' });
    return el;
  }

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('user').value.trim();
    const password = document.getElementById('pass').value;
    try {
      const res = await fetch('/login', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      if (!res.ok) { add('system', 'Sign-in failed.', { label: 'error' }); return; }
      const data = await res.json();
      token = data.token;
      // A new sign-in starts a new conversation. Carrying a session id across
      // identities would send one user's session to /chat as another.
      sessionId = null;
      // textContent, not innerHTML — the username is attacker-chosen text.
      who.textContent = '';
      const name = document.createElement('b');
      name.textContent = username;
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = data.role;
      who.append(name, ` · clearance ${data.clearance}`, badge);

      loginForm.style.display = 'none';
      if (data.role === 'uploader') {
        // The uploader has no read path at all: /query and /chat return 403 for
        // this role, so the UI shows the one thing the account can actually do.
        const me = await (await fetch('/me', {
          headers: { authorization: 'Bearer ' + token },
        })).json();
        const tier = document.getElementById('tier');
        tier.replaceChildren(...me.writable_tiers.map((t) => new Option(t, t)));
        uploader.style.display = 'flex';
        add('system',
            `Signed in as ${username}. Upload-only account — questions are not available to this role.`,
            { label: 'system' });
      } else {
        composer.style.display = 'flex';
        document.getElementById('message').focus();
        add('system', `Signed in as ${username} (${data.clearance}).`, { label: 'system' });
      }
    } catch (err) {
      add('system', 'Cannot reach the API.', { label: 'error' });
    }
  });

  uploader.addEventListener('submit', async (e) => {
    e.preventDefault();
    const picker = document.getElementById('file');
    const put = document.getElementById('put');
    const file = picker.files[0];
    if (!file) return;
    const tier = document.getElementById('tier').value;
    put.disabled = true;
    try {
      const content = await file.text();
      const res = await fetch('/upload', {
        method: 'POST',
        headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token },
        body: JSON.stringify({ filename: file.name, tier, content }),
      });
      if (res.status === 401) { signedOut('Session expired — sign in again.'); return; }
      const data = await res.json();
      if (!res.ok) {
        add('system', data.detail || 'Upload rejected.', { label: 'error' });
        return;
      }
      add('system',
          `${data.replaced ? 'Replaced' : 'Indexed'} ${data.source} — ${data.chunks} chunk(s) in ${data.tier}.`,
          { label: 'upload' });
      picker.value = '';
    } catch (err) {
      add('system', 'Upload failed.', { label: 'error' });
    } finally {
      put.disabled = false;
    }
  });

  composer.addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = document.getElementById('message');
    const send = document.getElementById('send');
    const message = input.value.trim();
    if (!message) return;
    input.value = '';
    add('user', message, { label: 'you' });
    const pending = add('assistant', 'thinking…', { label: 'assistant' });
    send.disabled = true;
    try {
      // `let`, not `const` — reassigned by the 404 recovery path below.
      let res = await fetch('/chat', {
        method: 'POST',
        headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token },
        body: JSON.stringify({ message, session_id: sessionId }),
      });
      if (res.status === 401) {
        pending.remove();
        signedOut('Session expired — sign in again.');
        return;
      }
      // 404 means the conversation no longer exists server-side — sessions are
      // in-memory, so a server restart drops them. Start a fresh conversation
      // and resend rather than making the user retype.
      if (res.status === 404) {
        sessionId = null;
        res = await fetch('/chat', {
          method: 'POST',
          headers: { 'content-type': 'application/json', authorization: 'Bearer ' + token },
          body: JSON.stringify({ message, session_id: null }),
        });
        add('system', 'Previous conversation was dropped by a server restart; started a new one.',
            { label: 'system' });
      }
      const data = await res.json();
      sessionId = data.session_id || sessionId;
      pending.remove();
      add('assistant', data.answer, {
        label: data.refused ? 'assistant · refused' : 'assistant',
        refused: data.refused,
      });
    } catch (err) {
      pending.remove();
      add('system', 'Request failed.', { label: 'error' });
    } finally {
      send.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
